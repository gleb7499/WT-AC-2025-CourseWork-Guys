version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: volunteer-help-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - volunteer-help-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: volunteer-help-server
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app
      JWT_ACCESS_SECRET: change-me-in-production-min-32-characters-long-secret-key
      JWT_REFRESH_SECRET: change-me-in-production-min-32-characters-long-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
      PORT: 3000
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - volunteer-help-network
    command: sh -c "npx prisma db push && npx prisma db seed && node dist/index.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: volunteer-help-web
    environment:
      VITE_API_URL: http://localhost:3000/api
    depends_on:
      - server
    ports:
      - "5173:5173"
    networks:
      - volunteer-help-network

volumes:
  postgres_data:

networks:
  volunteer-help-network:
    driver: bridge
